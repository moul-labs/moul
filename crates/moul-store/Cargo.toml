[package]
name = "moul-store"
description = "SQLite access for Moul: the shared, writer-only and device stores, system tables and migrations."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["sqlite", "storage", "migrations", "database", "wasm"]
categories = ["database"]

[dependencies]
moul-vfs.workspace = true
rusqlite.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
sqlite-wasm-rs = { workspace = true, features = ["wasm-bindgen"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[lints]
workspace = true
