[package]
name = "moul-vfs"
description = "SQLite file layer for Moul that records the pages each commit changes, with back ends for browser storage (OPFS), disk and memory."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["sqlite", "vfs", "opfs", "wasm", "storage"]
categories = ["database-implementations", "filesystem", "wasm"]

[dependencies]
moul-ltx.workspace = true
rsqlite-vfs.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
  "DomException",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemGetDirectoryOptions",
  "FileSystemGetFileOptions",
  "FileSystemReadWriteOptions",
  "FileSystemRemoveOptions",
  "FileSystemSyncAccessHandle",
  "StorageManager",
  "WorkerGlobalScope",
  "WorkerNavigator",
] }

[dev-dependencies]
rusqlite.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
sqlite-wasm-rs = { workspace = true, features = ["wasm-bindgen"] }
wasm-bindgen-test.workspace = true

[lints]
workspace = true
