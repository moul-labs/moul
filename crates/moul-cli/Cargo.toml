[package]
name = "moul-cli"
description = "The moul command-line tool: pull, restore, check, serve, hub and deploy."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["cli", "sqlite", "litestream", "backend", "deploy"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "moul"
path = "src/main.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
moul-ltx.workspace = true
moul-vfs.workspace = true
moul-store.workspace = true
moul-core.workspace = true
moul-rules.workspace = true
moul-sync.workspace = true
moul-server.workspace = true
moul-hub.workspace = true
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
moul-fixtures.workspace = true

[lints]
workspace = true
