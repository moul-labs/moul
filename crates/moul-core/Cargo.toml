[package]
name = "moul-core"
description = "The Moul engine: collections, records, auth, files, realtime and the change log. Takes a request and returns a response."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["backend", "local-first", "sqlite", "realtime", "wasm"]
categories = ["database", "web-programming", "wasm"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
moul-store.workspace = true
moul-rules.workspace = true
moul-vfs.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hmac.workspace = true
blowfish.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.3.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
sqlite-wasm-rs = { workspace = true, features = ["wasm-bindgen"] }

[dev-dependencies]
moul-store.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
moul-fixtures.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
serde_json.workspace = true

[lints]
workspace = true
