[package]
name = "moul-web"
description = "Browser host for the Moul engine: worker entry point, message protocol and tab coordination."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["wasm", "browser", "web-worker", "opfs", "local-first"]
categories = ["wasm", "web-programming"]

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"]

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
moul-ltx.workspace = true
moul-vfs.workspace = true
moul-store.workspace = true
moul-sync.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
  "BroadcastChannel",
  "DedicatedWorkerGlobalScope",
  "MessageEvent",
  "WorkerGlobalScope",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
moul-vfs.workspace = true
moul-store.workspace = true
moul-sync.workspace = true
web-sys = { workspace = true, features = [
  "WorkerGlobalScope",
  "WorkerNavigator",
  "StorageManager",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemGetFileOptions",
  "FileSystemSyncAccessHandle",
  "FileSystemReadWriteOptions",
] }

[lints]
workspace = true
