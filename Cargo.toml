[workspace]
resolver = "3"
members = ["crates/*", "tools/moul-fixtures", "tools/litestream-compat"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/moul-labs/moul"
homepage = "https://moul.dev"

# Internal crates, so a member can write `moul-ltx.workspace = true`.
# Keep these versions in step with `workspace.package.version`.
[workspace.dependencies]
moul = { version = "0.0.1", path = "crates/moul" }
moul-ltx = { version = "0.0.1", path = "crates/moul-ltx" }
moul-vfs = { version = "0.0.1", path = "crates/moul-vfs" }
moul-store = { version = "0.0.1", path = "crates/moul-store" }
moul-rules = { version = "0.0.1", path = "crates/moul-rules" }
moul-core = { version = "0.0.1", path = "crates/moul-core" }
moul-sync = { version = "0.0.1", path = "crates/moul-sync" }
moul-web = { version = "0.0.1", path = "crates/moul-web" }
moul-server = { version = "0.0.1", path = "crates/moul-server" }
moul-hub = { version = "0.0.1", path = "crates/moul-hub" }
moul-cli = { version = "0.0.1", path = "crates/moul-cli" }

# Test-only crate that loads fixtures/go; never published.
moul-fixtures = { path = "tools/moul-fixtures" }

# Third-party crates. Members opt in with `<name>.workspace = true`.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
wasm-bindgen-test = "0.3.80"
js-sys = "0.3.107"
web-sys = "0.3.107"
# SQLite. Native builds compile the bundled amalgamation; the browser build gets
# SQLite from sqlite-wasm-rs, whose `wasm-bindgen` feature supplies the host
# functions it needs.
rusqlite = { version = "0.43.0", features = ["bundled", "hooks", "functions"] }
sqlite-wasm-rs = { version = "0.6.3", default-features = false }
rsqlite-vfs = "0.2.0"
# S3 request signing (SigV4). Pure Rust, so it builds for the browser too.
sha2 = "0.10.9"
hmac = "0.12.1"
# Password hashing: bcrypt on RustCrypto's Blowfish, so salts come from the
# engine's host and the browser build needs no OS randomness.
blowfish = { version = "0.9.1", features = ["bcrypt"] }
# Native HTTP for the S3 transport; the browser uses fetch.
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# SQLite's C code and other dependencies run optimised in debug builds, so the
# crash-safety suite, which reopens a database thousands of times, stays quick.
[profile.dev.package."*"]
opt-level = 2

# LTX encoding and checksums run over every page of a database; the
# compatibility and lock-page suites restore more than a gigabyte.
[profile.dev.package.moul-ltx]
opt-level = 2
