name: Sync against R2 and S3

# The sync suite's S3 tests against the real services, nightly. Each runs only
# when its secrets are set: an endpoint, a bucket and a key scoped to it.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  s3:
    name: ${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: Cloudflare R2
            prefix: R2
          - service: Amazon S3
            prefix: AWS_S3
    runs-on: ubuntu-latest
    env:
      MOUL_S3_ENDPOINT: ${{ secrets[format('{0}_ENDPOINT', matrix.prefix)] }}
      MOUL_S3_REGION: ${{ secrets[format('{0}_REGION', matrix.prefix)] }}
      MOUL_S3_BUCKET: ${{ secrets[format('{0}_BUCKET', matrix.prefix)] }}
      MOUL_S3_ACCESS_KEY_ID: ${{ secrets[format('{0}_ACCESS_KEY_ID', matrix.prefix)] }}
      MOUL_S3_SECRET_ACCESS_KEY: ${{ secrets[format('{0}_SECRET_ACCESS_KEY', matrix.prefix)] }}
      MOUL_S3_PATH_STYLE: ${{ matrix.prefix == 'R2' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Run
        if: env.MOUL_S3_ENDPOINT != ''
        run: cargo test -p moul-sync --test s3
      - name: Skipped
        if: env.MOUL_S3_ENDPOINT == ''
        run: echo "No ${{ matrix.prefix }}_* secrets; skipping."
