name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rustup reads rust-toolchain.toml, which adds rustfmt, clippy and the wasm target.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --target wasm32-unknown-unknown
      - run: cargo doc --workspace --no-deps

  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The runners have Go; the Litestream suite runs in its own job.
      MOUL_SKIP_LITESTREAM: "1"
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  crash-safety:
    name: Crash safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Every crash point of the storage workload, and of recovery after it.
      # Debug builds sample every few points; this runs them all.
      - run: cargo test -p moul-vfs --release --test crash -- --nocapture

  litestream:
    name: Litestream compatibility
    runs-on: ubuntu-latest
    env:
      MOUL_REQUIRE_LITESTREAM: "1"
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/litestream-compat/go.mod
          cache-dependency-path: tools/litestream-compat/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
        working-directory: tools/litestream-compat
      - run: go vet ./...
        working-directory: tools/litestream-compat
      # Litestream 0.5.13 restores Moul's replicas and Moul restores
      # Litestream's, compared page by page.
      - run: cargo test -p litestream-compat

  wasm-build:
    name: Browser target builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --target wasm32-unknown-unknown
      - run: cargo build --workspace --target wasm32-unknown-unknown --release

  browser:
    name: Browser (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: browser
      - name: Read the wasm-bindgen version from Cargo.lock
        id: wbg
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wbg.outputs.version }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-tests/package-lock.json
      - run: npm ci
        working-directory: browser-tests
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: browser-tests
      - run: node run.mjs --browsers ${{ matrix.browser }}
        working-directory: browser-tests

  go-fixtures-tool:
    name: Go fixture exporter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: tools/go-fixtures/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
        working-directory: tools/go-fixtures
      - run: go vet ./...
        working-directory: tools/go-fixtures
