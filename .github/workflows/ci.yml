name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rustup reads rust-toolchain.toml, which adds rustfmt, clippy and the wasm target.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --target wasm32-unknown-unknown
      - run: cargo doc --workspace --no-deps

  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The runners have Go; the Litestream suite runs in its own job.
      MOUL_SKIP_LITESTREAM: "1"
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  crash-safety:
    name: Crash safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Every crash point of the storage workload, and of recovery after it.
      # Debug builds sample every few points; this runs them all.
      - run: cargo test -p moul-vfs --release --test crash -- --nocapture

  litestream:
    name: Litestream compatibility
    runs-on: ubuntu-latest
    env:
      MOUL_REQUIRE_LITESTREAM: "1"
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/litestream-compat/go.mod
          cache-dependency-path: tools/litestream-compat/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
        working-directory: tools/litestream-compat
      - run: go vet ./...
        working-directory: tools/litestream-compat
      # Litestream 0.5.13 restores Moul's replicas and Moul restores
      # Litestream's, compared page by page.
      - run: cargo test -p litestream-compat

  sync-s3:
    name: Sync and the hub against RustFS
    runs-on: ubuntu-latest
    env:
      MOUL_REQUIRE_S3: "1"
      MOUL_S3_ENDPOINT: http://127.0.0.1:9000
      MOUL_S3_BUCKET: moul-test
      MOUL_S3_ACCESS_KEY_ID: moul-test
      MOUL_S3_SECRET_ACCESS_KEY: moul-test-secret
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: scripts/start-rustfs.sh
      # Conditional writes, racing devices, hand-off and conflicts through a
      # real S3-compatible store.
      - run: cargo test -p moul-sync --test s3
      # Devices syncing through a hub whose replicas are in the bucket.
      - run: cargo test -p moul-hub --test hub

  demo:
    name: Demo page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: demo
      - name: Read the wasm-bindgen version from Cargo.lock
        id: wbg
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wbg.outputs.version }}
      - run: scripts/build-demo.sh
      # The plan's budget: the engine and SQLite under 2 MB gzipped.
      - name: Check the size budget
        run: |
          gz=$(gzip -9 -c demo/pkg/moul_web_bg.wasm | wc -c)
          echo "engine: $gz bytes gzipped"
          test "$gz" -le 2097152
      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: demo

  wasm-build:
    name: Browser target builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --target wasm32-unknown-unknown
      - run: cargo build --workspace --target wasm32-unknown-unknown --release

  browser:
    name: Browser (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: browser
      - name: Read the wasm-bindgen version from Cargo.lock
        id: wbg
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wbg.outputs.version }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-tests/package-lock.json
      - run: npm ci
        working-directory: browser-tests
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: browser-tests
      - run: node run.mjs --browsers ${{ matrix.browser }}
        working-directory: browser-tests

  go-fixtures-tool:
    name: Go fixture exporter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: tools/go-fixtures/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
        working-directory: tools/go-fixtures
      - run: go vet ./...
        working-directory: tools/go-fixtures

  typescript:
    name: SDK, Studio and Playground
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-release
      - name: Read the wasm-bindgen version from Cargo.lock
        id: wbg
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wbg.outputs.version }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: scripts/build-wasm.sh
      - name: Check the size budget
        run: |
          gz=$(gzip -9 -c packages/client/wasm/moul_web_bg.wasm | wc -c)
          echo "engine: $gz bytes gzipped"
          test "$gz" -le 2097152
      - run: npm ci
      # Build first: Studio and the Playground take the SDK's types and code from its dist (and
      # the Playground takes Studio's types from Studio's), which a fresh checkout does not have.
      # The workspaces build in order: the SDK, Studio, then the Playground.
      - run: npm run build
      - run: npm run typecheck
      # The SDK's tests run on the headless engine in Node.
      - run: npm test
      - run: npm pack --dry-run -w @moul-dev/client -w @moul-dev/studio
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            packages/client/dist
            packages/client/wasm
            packages/studio/dist
            sites/playground/dist

  e2e:
    name: End to end (${{ matrix.browser }})
    needs: typescript
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    env:
      MOUL_S3_ENDPOINT: http://127.0.0.1:9000
      MOUL_S3_BUCKET: moul-test
      MOUL_S3_ACCESS_KEY_ID: moul-test
      MOUL_S3_SECRET_ACCESS_KEY: moul-test-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            browser-tests/package-lock.json
      # The workspace's dependencies: Vite, and what Studio leaves to the app (Lit, Moul UI, TanStack).
      - run: npm ci
      - run: npm ci
        working-directory: browser-tests
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: browser-tests
      - run: scripts/start-rustfs.sh
      # The SDK in a worker: tabs sharing a database, live queries, leader hand-off.
      - run: node e2e.mjs --browsers ${{ matrix.browser }}
        working-directory: browser-tests
      # The built Playground under its own CSP, offline, and two devices syncing through RustFS.
      - run: node playground.mjs --browsers ${{ matrix.browser }}
        working-directory: browser-tests
      # Studio's dist build in an app bundled with Vite: the Overview, the SDK's changes, the download.
      - run: node studio.mjs --browsers ${{ matrix.browser }}
        working-directory: browser-tests

  budgets:
    name: Time budgets (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: budgets
      # The plan's budgets beside the size one: opening a database and a commit (on disk and in
      # memory), and restoring a 50 MB database from a replica. Release builds; the tests print
      # what they measure.
      - run: cargo test -p moul-core --release --test budgets -- --ignored --nocapture
      - run: cargo test -p moul-sync --release --test budgets -- --ignored --nocapture

  budgets-browser:
    name: Time budgets (browsers)
    needs: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-tests/package-lock.json
      - run: npm ci
        working-directory: browser-tests
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: browser-tests
      # Opening a database and creating a record through the SDK: Chromium with its CPU slowed 4x
      # (the page's main thread; it cannot slow workers), Firefox and WebKit at full speed.
      - run: node bench.mjs
        working-directory: browser-tests
